services:
  dcash-backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: dcash-backend
    env_file:
      - .env
    networks:
      - proxy_network
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - DB_SCHEMA=db_dtasc
      - FRONTEND_URL=https://dcash.dtasc.com.br
      - GOOGLE_CALLBACK_URL=https://dcash.dtasc.com.br/api/auth/google/callback
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always

  dcash-frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://dcash.dtasc.com.br/api
    container_name: dcash-frontend
    env_file:
      - .env
    networks:
      - proxy_network
    restart: always

  # Daily pg_dump of the (externally hosted) Postgres DB — there was no
  # backup mechanism at all before this (see audit). Backups land gzipped
  # in the dcash_backups volume; wire that volume to an off-host location
  # (rsync/S3/etc.) for real disaster recovery, a local volume alone only
  # protects against accidental data loss, not host loss.
  dcash-backup:
    image: postgres:15-alpine
    container_name: dcash-backup
    env_file:
      - .env
    environment:
      - PGHOST=postgres-db
      - PGPORT=5432
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASS}
      - PGDATABASE=${DB_NAME}
      - BACKUP_RETENTION_DAYS=14
    volumes:
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
      - dcash_backups:/backups
    networks:
      - proxy_network
    entrypoint: >
      sh -c "chmod +x /usr/local/bin/backup-db.sh &&
      while true; do /usr/local/bin/backup-db.sh; sleep 86400; done"
    restart: always

networks:
  proxy_network:
    external: true

volumes:
  dcash_backups:
